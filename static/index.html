<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPLC Analyst</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        dark: { 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-gray-50 h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-dark-900 text-white px-6 py-4 shadow-lg flex-shrink-0">
        <div class="max-w-4xl mx-auto flex items-center gap-3">
            <div class="w-10 h-10 bg-primary-600 rounded-lg flex items-center justify-center font-bold text-lg">
                HP
            </div>
            <div>
                <h1 class="text-xl font-semibold">HPLC Analyst</h1>
                <p class="text-gray-400 text-sm">Pharmaceutical HPLC Analysis Assistant</p>
            </div>
        </div>
    </header>

    <!-- Chat Area -->
    <main class="flex-1 overflow-y-auto" id="chat-container">
        <div class="max-w-4xl mx-auto px-4 py-6 space-y-6" id="messages"></div>
    </main>

    <!-- Input Area -->
    <footer class="bg-white border-t border-gray-200 px-4 py-4 flex-shrink-0">
        <div class="max-w-4xl mx-auto">
            <form id="chat-form" class="flex gap-3">
                <textarea
                    id="user-input"
                    class="flex-1 resize-none rounded-xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent placeholder-gray-400"
                    placeholder="Describe your HPLC analysis question..."
                    rows="1"
                ></textarea>
                <button
                    type="submit"
                    id="send-btn"
                    class="bg-primary-600 hover:bg-primary-700 text-white px-5 py-3 rounded-xl font-medium text-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex-shrink-0"
                >
                    Send
                </button>
            </form>
            <p class="text-xs text-gray-400 mt-2 text-center">
                AI assistant for pharmaceutical HPLC analysis. Not a substitute for professional judgment.
            </p>
        </div>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
